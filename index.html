<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SAIME — Tumhara Apna AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b0b12; --card: #16161f; --card2: #1e1e2a;
    --text: #f2f2f7; --muted: #9a9aad;
    --accent: #7c5cff; --accent2: #00d4ff;
    --user: #2b2b3d; --ai: #16161f;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #22222e; background: var(--card); }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #fff; }
  header h1 { font-size: 20px; letter-spacing: 1px; }
  header p { font-size: 12px; color: var(--muted); }
  .status { margin-left: auto; font-size: 12px; padding: 5px 10px; border-radius: 20px; background: #1a2b1a; color: #7be495; }
  .status.off { background: #2b1a1a; color: #ff8a8a; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--ai); border: 1px solid #262637; border-bottom-left-radius: 4px; }
  .msg.ai img { height: 16px; vertical-align: middle; margin-right: 4px; }
  .msg.typing { color: var(--muted); font-style: italic; }
  .welcome { text-align: center; padding: 30px 20px; color: var(--muted); }
  .welcome .big { font-size: 42px; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
  .welcome p { font-size: 14px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { padding: 8px 14px; border-radius: 20px; background: var(--card2); border: 1px solid #2c2c3d; font-size: 13px; cursor: pointer; color: var(--text); }
  .chip:active { background: #2c2c3d; }
  footer { padding: 12px; border-top: 1px solid #22222e; background: var(--card); display: flex; gap: 8px; }
  #input { flex: 1; background: var(--card2); border: 1px solid #2c2c3d; border-radius: 24px; color: var(--text); padding: 12px 16px; font-size: 15px; outline: none; }
  #send { width: 48px; height: 48px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  #send:disabled { opacity: 0.5; }
  .note { text-align: center; font-size: 11px; color: var(--muted); padding: 6px; }
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <div><h1>SAIME</h1><p>Tumhara apna AI — SATYA V1</p></div>
  <div class="status" id="status">● Online</div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="big">SAIME</div>
    <p>Namaste! Main SAIME hoon — tumhara apna AI.<br>Sawal poochho, doubt confirm karo, kuch bhi seekho!</p>
    <div class="chips">
      <div class="chip" data-q="Who are you?">Who are you?</div>
      <div class="chip" data-q="What is the capital of India?">Capital of India?</div>
      <div class="chip" data-q="Tum kaun ho?">Tum kaun ho?</div>
      <div class="chip" data-q="5 + 3 kitna hota hai?">5 + 3 = ?</div>
    </div>
  </div>
</div>

<footer>
  <input id="input" type="text" placeholder="Sawal likho..." autocomplete="off">
  <button id="send" title="Bhejo">➤</button>
</footer>
<div class="note">SAIME har sawal se seekhta hai — jitna use karoge, utna smart banega!</div>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.js";

// SAIME backend (Colab Gradio app) — jab link badle, sirf ye line badalni hai.
const BACKEND_URL = "https://a9cfabdef25efdf08e.gradio.live";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const welcome = document.getElementById("welcome");

let client = null;
let clientPromise = null;

function setStatus(online) {
  statusEl.textContent = online ? "● Online" : "● Offline";
  statusEl.classList.toggle("off", !online);
}

function getClient() {
  if (!clientPromise) {
    clientPromise = Client.connect(BACKEND_URL).then(c => {
      client = c; setStatus(true); return c;
    }).catch(e => {
      console.error("Backend connect fail:", e);
      setStatus(false); clientPromise = null; throw e;
    });
  }
  return clientPromise;
}

function addMsg(text, who) {
  if (welcome) welcome.remove();
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "ai") {
    div.innerHTML = text;
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function ask(q) {
  addMsg(q, "user");
  input.value = "";
  const typing = addMsg("SAIME soch raha hai...", "ai");
  typing.classList.add("typing");
  sendBtn.disabled = true;
  try {
    const c = await getClient();
    const result = await c.predict("/saime_chat", [q]);
    const answer = (result.data && result.data[0]) ? String(result.data[0]) : "Mujhe ye nahi pata. Kuch aur poochho!";
    typing.classList.remove("typing");
    typing.innerHTML = answer;
  } catch (e) {
    console.error(e);
    typing.classList.remove("typing");
    typing.textContent = "SAIME abhi offline hai — thodi der me try karo!";
    setStatus(false);
  }
  sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.addEventListener("click", () => {
  const q = input.value.trim();
  if (q) ask(q);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const q = input.value.trim();
    if (q) ask(q);
  }
});
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => ask(chip.dataset.q));
});

// Backend check on load
getClient().catch(() => {});
</script>
</body>
</html>
